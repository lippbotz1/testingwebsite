<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support Siciabuzz</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0e0e14;
    color: #fff;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .box { max-width: 320px; width: 100%; }
  .icon-wrap {
    width: 68px;
    height: 68px;
    border-radius: 20px;
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    box-shadow: 0 12px 32px rgba(59,130,246,0.4);
  }
  .icon-wrap svg { width: 34px; height: 34px; fill: #fff; }
  h1 {
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 10px;
    letter-spacing: -0.4px;
  }
  p {
    font-size: 13.5px;
    color: #8b8b9e;
    line-height: 1.6;
    margin-bottom: 24px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    color: #fff;
    padding: 15px 24px;
    border-radius: 100px;
    font-size: 14.5px;
    font-weight: 700;
    text-decoration: none;
    box-shadow: 0 8px 24px rgba(59,130,246,0.4);
    transition: all 0.2s ease;
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(59,130,246,0.6);
  }
  .btn svg {
    width: 18px; height: 18px;
    stroke: #fff; fill: none;
    stroke-width: 2.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .hint {
    margin-top: 16px;
    font-size: 11.5px;
    color: #5a5a6e;
  }
</style>
</head>
<body>

  <div class="box">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24"><path d="M12 1a9 9 0 0 0-9 9v7a3 3 0 0 0 3 3h1a1 1 0 0 0 1-1v-6a1 1 0 0 0-1-1H5v-2a7 7 0 1 1 14 0v2h-2a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h1v1a2 2 0 0 1-2 2h-3a1 1 0 0 0 0 2h3a4 4 0 0 0 4-4V10a9 9 0 0 0-9-9z"/></svg>
    </div>

    <h1>Support Siciabuzz</h1>
    <p>Butuh bantuan atau mau kasih dukungan?<br>Klik tombol di bawah untuk lanjut.</p>

    <!-- EDIT LINK DI SINI -->
    <a class="btn" href="https://sociabuzz.com/_alippe/tribe" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"/></svg>
      Buka Halaman Support
    </a>

    <div class="hint">Kamu akan diarahkan ke halaman Siciabuzz</div>
  </div>

</html>
