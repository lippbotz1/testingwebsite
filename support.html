<style>
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }

    width: 100%; padding: 15px 20px; border-radius: 14px;
    color: #fff; text-decoration: none; font-size: 14px; font-weight: 750;
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    box-shadow: 0 8px 24px rgba(59,130,246,.28);
  }
  .btn:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }
